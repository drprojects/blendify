# MALIBU3D ROI D075_UU-S1-3 — the "studio" scene.
#
# Everything in one .blend: all point cloud colour layers (including a muted
# backdrop variant), plus the network graphs as separate objects you can toggle
# in the Outliner. Export from THIS config when you want to tune in the GUI.
#
# Scaffolding for the eventual six graphs: three network types
# (ROADS / RAILROADS / TRANSMISSION_LINES) x two sources (ground truth /
# prediction). Add one entry per graph to `graphs.items`; each may override
# colour, height, radius, alpha and emission. Give ground truth and prediction
# the SAME height and different colours so disagreements read as colour rather
# than parallax.
extends: malibu3d_D075_UU-S1-3.yaml

color:
  variants:
    # The backdrop for graph figures: same photo, desaturated so the network
    # reads on top of it. Select it in the GUI as `color_rgb_muted`, and dial
    # the `cloud_alpha` node down until you like it.
    - name: rgb_muted
      from: rgb
      saturation: 0.5
      alpha: 0.05       # this layer's own opacity; every other layer stays 1.0

point_cloud:
  alpha: 1.0          # global scrubber stays neutral; rgb_muted carries its own

graphs:
  height: 45.0
  radius: 1.6
  node_radius: 2.6
  alpha: 1.0
  emission: 0.15
  items:
    - path: data/malibu3d/send_29_07_v2/blender_export/D075_UU-S1-3/D075_UU-S1-3_ROADS_graph.gpkg
      name: roads_gt
      color: [0.30, 0.55, 1.00]

    # Add as they arrive, e.g.:
    # - path: .../D075_UU-S1-3_RAILROADS_graph.gpkg
    #   name: railroads_gt
    #   color: [1.00, 0.45, 0.25]
    # - path: .../roads_pred.gpkg
    #   name: roads_pred
    #   color: [1.00, 0.85, 0.25]
