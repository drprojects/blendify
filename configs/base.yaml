# Defaults inherited by every figure config.
# A figure config overrides only what it needs; anything absent falls back here.
# Values reproduce the hardcoded defaults of the pre-YAML examples/00_custom.py.

data:
  path: null            # .pt | .ply | .ply.gz | .npz | .las | .laz
  palettes: null        # palette JSON, for formats carrying raw label/scalar fields
  palette_overrides: null   # JSON/YAML patching the above without editing it
  cache: true           # cache the parsed cloud; rebuilt when source or palette changes
  cache_dir: data/.figcache
  colors: null          # subset of colorizations to keep (null = all found)
  add_xyz: false        # add an `xyz` colorization: normalized position as RGB
  drop_void: null       # drop points unlabelled in these layers, e.g. [elevation].
                        # Applied to every colorization at once, so all figures
                        # of a scene keep an identical point set.
  voxel: 0.02           # sphere radius of a rendered point, in scene units
  center: true          # recenter on XY, drop min Z to 0
  default_color: 0_level  # which colorization drives the video / initial scene
  subsample: null       # keep at most N points (null = keep all)
  seed: 0               # subsampling seed, so figures stay reproducible

render:
  engine: CYCLES        # CYCLES | BLENDER_EEVEE | BLENDER_WORKBENCH
  n_samples: 64
  resolution: [2100, 1400]
  cpu: false
  transparent_film: true
  view_transform: Standard

camera:
  translation: [0.0, 0.0, 10.0]
  quaternion: [1.0, 0.0, 0.0, 0.0]   # [w, x, y, z]
  fov_x_deg: 73
  near: 0.1
  far: 1000

sun:
  energy: 1
  color: [1.0, 1.0, 1.0]
  location: [0, 0, 5]
  rotation_euler: [1, 0, 2]

world:
  color: [1, 0.934681, 0.78918]
  strength: 1.3

point_cloud:
  specularity: 0.1
  roughness: 0.2
  rotation_euler: [0.0, 0.0, 0.0]
  marker_type: spheres
  alpha: 1.0            # global opacity, live-scrubbable in the GUI as the
                        # `cloud_alpha` node
  layer_alpha: {}       # per-layer opacity, e.g. {rgb_muted: 0.05}. Baked into
                        # that layer's alpha channel, so switching layer in the
                        # GUI switches opacity with it.

# Points with no annotation (a palette's Void / N/A class, or a non-finite
# value). They are kept so the geometry stays complete, but they carry no label
# and no metrics, so they are rendered as secondary rather than as a class.
void:
  color: [0.72, 0.72, 0.72]   # neutral grey; null keeps the palette's own colour
  alpha: 1.0                  # multiplies point_cloud.alpha; <1 fades them further

# Colour grading, applied to photographic layers only. Grading a categorical
# palette would break the match between a figure and its legend, so `apply_to`
# lists exactly which colorizations get touched.
color:
  apply_to: [rgb]
  # These drive shader nodes, so they are also the live GUI sliders.
  # NEUTRAL VALUES: saturation 1, contrast 0, brightness 0, exposure 0, gamma 1.
  saturation: 1.0       # <1 mutes, 0 greyscale, >1 boosts
  contrast: 0.0         # Blender Bright/Contrast: 0 is neutral, not 1
  brightness: 0.0       # additive lift
  exposure: 0.0         # stops of linear gain
  gamma: 1.0            # <1 lifts midtones
  white_balance: null   # per-channel multiplier, e.g. [1.0, 1.0, 0.95] to warm
  # Extra graded versions of a layer, kept alongside it as their own
  # colorizations — e.g. a muted backdrop to sit under a graph overlay.
  # Each entry: {name, from, plus any of the grading keys above}.
  variants: []

# Network graphs (roads / railroads / transmission lines), drawn as translucent
# tubes floating on one horizontal plane above the cloud. `items` is a list so a
# scene can carry several at once — e.g. ground truth and prediction for each of
# the three network types.
graphs:
  items: []             # [{path: ..., color: [r,g,b], height: ..., name: ...}, ...]
  coord_translation: auto   # `auto` reads it from the <roi>_meta.json sidecar
  height: 30.0          # metres above the cloud's ground plane
  radius: 1.0           # tube radius
  node_radius: 0.0      # sphere radius at graph nodes (0 = no nodes)
  color: [0.35, 0.55, 1.0]
  alpha: 1.0            # graphs read best opaque; fade the cloud instead
                        # via point_cloud.alpha
  emission: 0.2         # slight glow keeps it readable over dark geometry
  roughness: 0.35

export:
  # Write every colorization into the exported .blend as a separate colour
  # attribute on the one mesh, so you can switch layer in the GUI without
  # re-exporting. Cheap: geometry and sphere instancing are shared.
  all_layers: true

bbox:
  path: null
  face_alpha: 0.1
  sphere_r: 0.25
  edge_r: 0.15
  iou_threshold: 0.1

video:
  fps: 30
  duration: 20
  crf: 28
  preset: slow
  codec: libx264
  smoothness: 5.0
  # A figure needs these before --video will work:
  start_position: null
  start_target: null
  spiral_target: null
  spin_spiral_ratio: null
  spin_angle: null
  spiral_angle: null
  z_max: null
  r_max: null
  color_times: null     # [[color_key, time], ...] cross-fade schedule
  path_keypoints: null  # [[x, y, z], ...] overrides the spin phase with a path
