# Shared defaults for MALIBU3D aerial ROIs.
# Individual ROI configs extend this and override the camera.
extends: base.yaml

data:
  palettes: data/malibu3d/send_29_07_v2/blender_export/palettes.json
  # Fields the shared palettes.json does not describe. Tiles lacking the field
  # simply skip the entry, so this is safe to apply dataset-wide.
  palette_overrides: configs/palettes/malibu3d_extra.json
  default_color: rgb
  add_xyz: true
  # Points sit on a ~0.26 m grid, so 0.15 m would just close the gaps; 0.5 m
  # deliberately overlaps them so surfaces read as solid rather than stippled.
  # If you subsample, scale this up by sqrt(n_full / n_kept).
  voxel: 0.5
  center: true
  subsample: null
  # The subtile-seam points (no MNT coverage, see RESEARCH.md) are void in
  # elevation, forest AND natural_habitat alike, and would otherwise speckle a
  # 102.4 m grid across all three. Dropping by `elevation` removes exactly that
  # set. Deliberately NOT `semantic`, whose void class is a real 18% of the cloud.
  drop_void: [elevation]

render:
  engine: CYCLES
  n_samples: 64
  fast_gi: true           # contact shadows between crowns and under hedgerows
  ao_distance: 8.0
  ao_bounces: 1

sun:
  # Pure white light, so rendered colours match the palette hex as closely as
  # possible. A tinted source shifts every class colour toward its hue.
  energy: 3.4
  color: [1.0, 1.0, 1.0]
  # Sun lowered from 50 deg above the horizon to ~23, so crowns and terrain cast
  # real shadows instead of being read from colour alone.
  rotation_euler: [1.1693706, 0.0, 0.7853981852531433]
  angle: 2.5              # soft-edged shadows, suits an aerial scene

world:
  color: [1.0, 1.0, 1.0]   # white ambient, same reason as the sun
  # Lowered from 0.8: strong ambient fills the shadows back in and flattens the
  # scene. This is the other half of making relief readable.
  strength: 0.40

point_cloud:
  specularity: 0.05     # aerial lidar looks wrong when it glints
  roughness: 0.4

void:
  # ONE colour for the unlabelled points of EVERY categorical layer, so figures
  # stay consistent: #C4C4C4. Change it here and every layer follows; the GUI
  # panel exposes the same single control.
  color: [0.7686275, 0.7686275, 0.7686275]   # #C4C4C4
  alpha: 0.55

color:
  # The aerial RGB comes in a touch over-saturated, mostly in the greens.
  # Sweep with: --set color.saturation=0.7 (or 1.0 to see the raw values).
  apply_to: [rgb]
  saturation: 0.85
  variants:
    # Greyscale, from the photo only — label palettes must keep their colours.
    - name: grayscale
      from: rgb
      saturation: 0.0
    # Muted backdrop for graph figures: desaturated and nearly transparent.
    - name: rgb_muted
      from: rgb
      saturation: 0.5
      alpha: 0.05

graphs:
  # Networks float above the cloud. Node spheres are given a positive radius so
  # the objects exist and stay tunable in the GUI; set 0 to omit them entirely.
  height: 45.0
  radius: 1.6
  node_radius: 2.4
  alpha: 1.0
  emission: 0.15
